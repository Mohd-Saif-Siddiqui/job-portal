server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:jobportal}
    username: ${POSTGRES_USER:jobportal}
    password: ${POSTGRES_PASSWORD:jobportal}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  # Where uploaded resumes are stored (relative to the folder you run the backend from).
  upload-dir: uploads
  # Inserts demo skills, jobs and two demo accounts when the database is empty. Turn off in production.
  seed-demo-data: true
